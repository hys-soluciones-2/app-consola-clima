name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  version:
    name: Leer versión
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver versión y tag
        id: meta
        shell: bash
        run: |
          VERSION=$(jq -r '.version' package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "No se pudo leer .version de package.json" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe; no se creará otro release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: weather-linux
          - os: macos-latest
            asset: weather-macos
          - os: windows-latest
            asset: weather.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Bun (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Instalar Bun (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -c "irm bun.sh/install.ps1 | iex"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.bun\bin"

      - name: Verificar Bun
        run: bun --version

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar binario
        run: bun run build

      - name: Preparar binario (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv weather "${{ matrix.asset }}"
          test -f "${{ matrix.asset }}"

      - name: Verificar binario (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "weather.exe")) { throw "No se generó weather.exe" }

      - name: Subir binario
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Crear release
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Crear release con los binarios
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes
